<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day14</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <form class="bg-primary-subtle">
      <h2 class="pt-3">User Registration</h2>
      <div class="mb-3 col-8 pt-2 ms-3">
        <label for="exampleInputName" class="form-label">User Name</label>
        <input type="text" class="form-control" id="exampleInputName" />
      </div>
      <div class="mb-3 col-8 ms-3">
        <label for="exampleInputAge" class="form-label">Age</label>
        <input type="text" class="form-control" id="exampleInputAge" />
      </div>
      <div class="mb-3 col-8 ms-3">
        <label for="exampleInputJob" class="form-label">Job Title</label>
        <input type="text" class="form-control" id="exampleInputJob" />
      </div>
      <button type="submit" class="btn btn-primary mt-2 mb-4 ms-3">
        Submit
      </button>
    </form>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./javascript/script.js"></script>
  </body>
</html>
